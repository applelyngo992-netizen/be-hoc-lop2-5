function clockSvg(h,m){

  const ha=((h%12)+m/60)*30*Math.PI/180,ma=m*6*Math.PI/180;
  return `<svg viewBox="0 0 120 120" width="170" role="img" aria-label="Đồng hồ"><circle class="face" cx="60" cy="60" r="56" stroke-width="3"/>${t}<line x1="60" y1="60" x2="${60+26*Math.sin(ha)}" y2="${60-26*Math.cos(ha)}" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/><line x1="60" y1="60" x2="${60+38*Math.sin(ma)}" y2="${60-38*Math.cos(ma)}" stroke="var(--toan)" stroke-width="3" stroke-linecap="round"/><circle cx="60" cy="60" r="4" fill="var(--ink)"/></svg>`;
}
function numlineSvg(v){
  const n=Math.round((v.to-v.from)/v.step);const W=340,x0=24,x1=W-24;let s='';
  s+=`<line x1="${x0-10}" y1="34" x2="${x1+14}" y2="34" stroke="var(--ink)" stroke-width="3"/><path d="M${x1+14} 34 l-8 -5 v10z" fill="var(--ink)"/>`;
  for(let i=0;i<=n;i++){
    const val=v.from+i*v.step,x=x0+(x1-x0)*i/n,blank=(v.blanks||[]).includes(val);
    s+=`<line x1="${x}" y1="26" x2="${x}" y2="42" stroke="var(--ink)" stroke-width="2.5"/>`;
    s+=blank?`<rect x="${x-14}" y="48" width="28" height="22" rx="5" fill="none" stroke="var(--toan)" stroke-width="2.5" stroke-dasharray="4 3"/>`:`<text x="${x}" y="64" text-anchor="middle" font-size="15">${val}</text>`;
  }
  return `<svg viewBox="0 0 ${W} 78" width="${W}" role="img" aria-label="Tia số">${s}</svg>`;
}
function dotsSvg(v){
  const per=10,r=9,gap=4,rows=Math.max(1,Math.ceil(Math.max(v.a,v.b)/per));
  const grp=(n,y,color,cross)=>{let s='';for(let i=0;i<n;i++){const cx=r+(i%per)*(2*r+gap),cy=y+r+Math.floor(i/per)*(2*r+gap);s+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${color}" stroke="var(--ink)" stroke-width="1.5"/>`;if(cross&&i>=n-cross)s+=`<path d="M${cx-6} ${cy-6}L${cx+6} ${cy+6}M${cx+6} ${cy-6}L${cx-6} ${cy+6}" stroke="var(--bad)" stroke-width="3"/>`}return s};
  const H=r*2+(rows-1)*(2*r+gap);
  let s;
  if(v.op==='−')s=grp(v.a,0,'var(--toan)',v.b);
  else s=grp(v.a,0,'var(--toan)')+grp(v.b,H+10,'var(--tv)');
  const total=v.op==='−'?H:H*2+10;
  return `<svg viewBox="0 0 ${per*(2*r+gap)} ${total+2}" width="${per*(2*r+gap)}" role="img" aria-label="Hình đếm">${s}</svg>`;
}
function visHtml(v){

function matchAns(v,ans){
  const nv=norm(v).replace(/\.$/,'');
  return [].concat(ans).some(a=>{
    const na=norm(a);if(nv===na)return true;
    const num=/^-?\d+([.,]\d+)?$/;const nvn=nv.replace(/\s/g,'');
    if(num.test(na)&&num.test(nvn))return parseFloat(na.replace(',','.'))===parseFloat(nvn.replace(',','.'));
    const m=na.match(/^(\d+)\s*[a-zà-ỹ]+$/);if(m&&num.test(nvn))return m[1]===nvn;
    return false;
  });
}

}
async function pdfMake(){

  try{await pdfLibs();const pages=await pdfPages();if(!pages.length)throw new Error('empty');
    const pdf=new window.jspdf.jsPDF({unit:'mm',format:'a4',orientation:'portrait'});
    pages.forEach((p,i)=>{if(i)pdf.addPage();pdf.addImage(p.url,'JPEG',10,10,190,p.h)});
    return{blob:pdf.output('blob'),pages}}
  catch(e){toast('Chưa tạo được PDF (cần có mạng). Bố mẹ mở bản chạy riêng bằng Chrome rồi bấm In.');return null}

async function pdfDeliver(blob){
  const name=pdfName();

    if(c){await c.save({filename:name,data:blob});toast('Đã lưu file PDF.');return}}catch(e){if(e&&e.code==='declined')return}
  try{const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),8000);toast('Đã tải file PDF xuống máy.')}
  catch(e){toast('Máy này chưa tải được file.')}}

function tensSvg(n){

  for(let i=0;i<t;i++){const x=8+i*30;s+=`<rect x="${x}" y="8" width="24" height="84" rx="4" fill="#F5B52B" stroke="var(--ink)" stroke-width="2"/>`;for(let k=1;k<10;k++)s+=`<line x1="${x}" x2="${x+24}" y1="${8+k*8.4}" y2="${8+k*8.4}" stroke="var(--ink)" stroke-width=".8"/>`}
  const ux=16+t*30+10;for(let i=0;i<u;i++){const cx=ux+(i%3)*22,cy=22+Math.floor(i/3)*26;s+=`<circle cx="${cx}" cy="${cy}" r="9" fill="#2FA99A" stroke="var(--ink)" stroke-width="2"/>`}
  s+=`<text x="${8+t*15}" y="110" text-anchor="middle" font-size="13" font-weight="800" fill="var(--ink)">${t} chục</text><text x="${ux+22}" y="110" text-anchor="middle" font-size="13" font-weight="800" fill="var(--ink)">${u} đơn vị</text>`;
  return `<div class="vis"><svg viewBox="0 0 ${Math.max(200,ux+90)} 118" width="100%" style="max-width:320px" role="img" aria-label="${t} chục và ${u} đơn vị">${s}</svg></div>`;
}

function lessonPrac(l){
  let its=[];

  else if(l.prac.gs){for(let i=0;i<6;i++)its.push(G[pickOne(l.prac.gs)]())}
  else if(l.prac.gen){its=[l.prac.gen()]}
  else{const pool=[];SHEETS.forEach(s=>{if(s.subject===l.prac.sub)s.items.forEach((it,i)=>{if(l.prac.tags.includes(tagOf(it,s.subject)))pool.push({item:it,subject:s.subject,tag:tagOf(it,s.subject),key:s.id+'#'+i})})});
    const ch=shuffle(pool).slice(0,5);if(!ch.length){toast('Chưa có câu luyện cho bài này.');return}startRun({title:'Làm thử: '+l.title,kind:'lesson',items:ch,subject:l.prac.sub});return}

}

  {n:26,p:102,t:'Đường gấp khúc. Hình tứ giác',mem:['Đường gấp khúc gồm các đoạn thẳng nối với nhau.','Độ dài đường gấp khúc bằng tổng độ dài các đoạn thẳng.','Hình tứ giác có 4 cạnh và 4 góc.'],pic:()=>`<div class="vis">${polySvg({lens:[3,4,2]})}</div>`+quadSvg(),prac:{gs:['gapkhuc','hinh']}},

const BK={};BOOK.forEach(c=>c.b.forEach(b=>{b.cd=c.cd;BK[b.n]=b}));
function vBook(){
  const done=S.bk||{};
  setView(`${topbar('Học theo sách Toán 2')}<main class="wrap"><section class="card"><p>Các bài theo sách Toán 2 tập một (Kết nối tri thức). Con xem cách làm, rồi bấm “Làm thử”.</p></section>
  ${BOOK.map(c=>`<h3>Chủ đề ${c.cd}: ${esc(c.t)}</h3><div class="weeks">${c.b.map(b=>`<button class="wk" data-act="bookLs" data-arg="${b.n}"><span class="n">${b.n}</span><span class="t"><b>${esc(b.t)}</b><small>Sách trang ${b.p}${done[b.n]?' · đã làm thử':''}</small></span>${done[b.n]?'<i class="dot on"></i>':''}</button>`).join('')}</div>`).join('')}</main>`);
}
function vBookLs(n){
  const b=BK[n];if(!b)return;
  const prev=BK[n-1],next=BK[n+1];
  setView(`${topbar('Bài '+n)}<main class="wrap">${heroH(BEM[n]||'📘','Bài '+n+'. '+esc(b.t),'Sách Toán 2 tập một, trang '+b.p,'toan')}<section class="card">${b.pic?b.pic():''}</section>
   <section class="card cardc" style="--c:#F2733A"><h3>📌 Con cần nhớ</h3>${tipH(esc(b.mem[0]))}<ul class="lsteps" style="list-style:disc">${b.mem.slice(1).map(s=>`<li>${esc(s)}</li>`).join('')}</ul></section>
   ${b.extra==='bang'?'<button class="btn block" data-act="bang">Học bảng cộng 6, 7, 8, 9</button>':''}${b.extra==='tru'?'<button class="btn block" data-act="tru">Học bảng trừ 11 đến 18</button>':''}
   <div class="row" style="justify-content:space-between">${prev?`<button class="link" data-act="bookLs" data-arg="${n-1}">← Bài ${n-1}</button>`:'<span></span>'}${next?`<button class="link" data-act="bookLs" data-arg="${n+1}">Bài ${n+1} →</button>`:''}</div>
   <div class="bar"><div class="in"><button class="btn" data-act="bookSay" data-arg="${n}">Nghe đọc</button><button class="btn pri" data-act="bookTry" data-arg="${n}">Làm thử</button></div></div><div style="height:5rem"></div></main>`);
}
function bookSay(n){const b=BK[n];sayChunks('Bài '+n+'. '+b.t+'. '+b.mem.join(' '),.95)}
function bookTry(n){const b=BK[n];S.bk=S.bk||{};S.bk[n]=1;save();lessonPrac({id:'b'+n,sub:'toan',title:'Bài '+n+'. '+b.t,prac:b.prac})}

function tvPrac(b){
  const tags=[];
  if(b.hoa.length)tags.push('Chữ hoa, viết hoa');
  if(b.nv)tags.push('Nghe viết');
  if(b.pb)tags.push('Chính tả');
  b.lt.forEach(k=>{if(k==='sv')tags.push('Từ chỉ sự vật');if(k==='hd')tags.push('Từ chỉ hoạt động');if(k==='dd')tags.push('Từ chỉ đặc điểm');if(k==='dc'||k==='dp')tags.push('Dấu câu');if(k==='hoaTen')tags.push('Chữ hoa, viết hoa');if(k==='chd'||k==='cdd'||k==='cgt')tags.push('Đặt câu, mở rộng câu')});
  if(b.dk)tags.push('Viết đoạn');
  return {tags:[...new Set(tags)],sub:'tv'};
}

function fcBuild(sub,N,lo,W){
  const subs=sub==='all'?['toan','tv']:[sub],per=Math.ceil(N/subs.length),weak=fcWeak(),out=[],seen=new Set();

    const wk=pool.filter(c=>weak[c.id]).length,fixedWant=Math.round(per*.45)+Math.min(3,wk);

  });

function stepsOf(label){

  for(let i=1;i<tk.length;i+=2){const op=tk[i],n=+tk[i+1];const r=op==='+'?cur+n:cur-n;out.push(`${cur} ${op==='-'?'−':'+'} ${n} = ${r}`);cur=r}
  return '<b>Con tính từ trái sang phải, từng bước một:</b><br>'+out.join('<br>')+'<br>Vậy kết quả là <b>'+cur+'</b>.';
}

const TMN={logic:'Toán vui (câu đố logic)',calc:'Tính một phép',multi:'Điền dấu, chọn đáp án (nhiều dòng)',doan:'Toán đố (viết bài giải ra vở)',tvn:'Tiếng Việt, câu hỏi ngắn',tvd:'Tiếng Việt, có đoạn văn dài'};

function poolFor(sub,w1,w2,tags,withWrite){
  const out=[];
  SHEETS.filter(s=>s.subject===sub&&s.week>=w1&&s.week<=w2).forEach(s=>s.items.forEach((it,i)=>{
    const ok=withWrite?true:CLOSED.includes(it.t);if(!ok)return;
    const tg=tagOf(it,sub);if(tags&&tags.length&&!tags.includes(tg))return;
    out.push({item:it,subject:sub,tag:tg,key:s.id+'#'+i,sheet:s.id});
  }));
  return out;
}

let rdWeek=null;
function readTexts(){
  const seen=new Set(),out=[];
  READS.forEach((x,i)=>{seen.add(x);out.push({text:x,w:i+1,id:'r'+i,kind:'Đoạn đọc 1 phút'})});
  SHEETS.forEach(s=>s.items.forEach(it=>{const t=it.passage||(it.t==='dictate'?it.text:null);if(t&&!seen.has(t)){seen.add(t);out.push({text:t,w:s.week,id:s.id,kind:it.passage?'Đoạn trong phiếu':'Câu ngắn (bài nghe viết)'})}}));
  out.sort((a,b)=>a.w-b.w);
  (S.readCustom||[]).forEach((c,i)=>out.push({text:c.text,w:'Sách',id:'c'+i,custom:true,bai:c.bai||0}));
  return out;
}
const wordsOf=t=>t.trim().split(/\s+/).filter(Boolean).length;
function readChart(){
  const days=[];const d=new Date();for(let i=6;i>=0;i--){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()-i);days.push(x)}
  const key=x=>x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');
  const best=days.map(x=>{const k=key(x);let b=0;(S.reads||[]).forEach(r=>{const rk=r.ts?key(new Date(r.ts)):'';if(rk===k&&r.wpm>b)b=r.wpm});return b});
  const max=Math.max(80,...best)+10,W=320,H=150,L=28,B=22,T=8,pw=(W-L-6)/7,y=v=>T+(H-T-B)*(1-v/max);
  let s='';[60,70].forEach(v=>{s+=`<line x1="${L}" x2="${W-4}" y1="${y(v)}" y2="${y(v)}" stroke="var(--good)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="${L-4}" y="${y(v)+4}" text-anchor="end" font-size="11" font-weight="800" fill="var(--ink)">${v}</text>`});
  best.forEach((v,i)=>{const x=L+i*pw+pw*.18,w=pw*.64;if(v>0)s+=`<rect x="${x}" y="${y(v)}" width="${w}" height="${y(0)-y(v)}" rx="5" fill="${v>=60?'#2FA99A':'#F2733A'}" stroke="var(--ink)" stroke-width="1.5"/><text x="${x+w/2}" y="${y(v)-3}" text-anchor="middle" font-size="11" font-weight="800" fill="var(--ink)">${v}</text>`;
    s+=`<text x="${x+w/2}" y="${H-6}" text-anchor="middle" font-size="10" fill="var(--muted)">${days[i].getDate()}/${days[i].getMonth()+1}</text>`});
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Số tiếng đọc đúng trong một phút, 7 ngày gần nhất">${s}</svg>`;
}
const readIdxBai=n=>readTexts().findIndex(x=>x.custom&&x.bai===n);
const baiLabel=n=>TVK[n]?'Bài '+n+'. '+TVK[n].t:'';
function vReading(){
  const list=readTexts();if(rdWeek==null)rdWeek=Math.min(18,Math.max(1,curWeek()));
  const shown=list.map((t,i)=>({t,i})).filter(x=>x.t.custom||x.t.w===rdWeek);
  setView(`${topbar('Tập đọc')}<main class="wrap"><section class="card"><p>Con đọc to một đoạn trong <b>1 phút</b>. Cô yêu cầu đọc <b>60 đến 70 tiếng một phút</b>, đọc đúng và rõ chữ. Bố mẹ ngồi nghe cùng con nhé.</p></section>
   <section class="card"><h3>7 ngày gần nhất</h3>${(S.reads||[]).length?readChart():'<p class="hint" style="margin-top:.4rem">Con đọc xong một đoạn thì biểu đồ hiện ở đây. Vạch xanh là 60 và 70 tiếng của cô.</p>'}</section>
   <section class="card flds"><h3>Chọn tuần</h3><div class="chips" id="rdWk">${Array.from({length:18},(_,k)=>`<button type="button" class="chip ${rdWeek===k+1?'on':''}" data-w="${k+1}">Tuần ${k+1}</button>`).join('')}</div></section>
   <section class="card"><h3>📗 Bài đọc theo sách Tiếng Việt 2</h3><p class="hint" style="margin:.3rem 0 .6rem">Bài sáng màu là bài đã có nội dung. Bài mờ là chưa có: bố mẹ gõ hoặc dán đoạn đọc trong sách ở mục “Dành cho bố mẹ”.</p><div class="chips">${TVB.map(r=>{const k=readIdxBai(r[0]);return `<button type="button" class="chip ${k>=0?'on':''}" style="${k>=0?'':'opacity:.5'}" title="${esc(r[2])}" data-act="${k>=0?'readOne':'readNo'}" data-arg="${k>=0?k:r[0]}">Bài ${r[0]}</button>`}).join('')}</div></section>
   <div class="weeks">${shown.map(({t,i})=>`<button class="wk tv" data-act="readOne" data-arg="${i}"><span class="n">${t.custom?'Sách':t.w}</span><span class="t"><b>${t.bai?esc(baiLabel(t.bai)):esc(t.text.slice(0,48))+'…'}</b><small>${wordsOf(t.text)} tiếng · ${t.custom?'Bài của sách':esc(t.kind)}</small></span></button>`).join('')}</div></main>`,()=>{$('#rdWk').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;rdWeek=+b.dataset.w;vReading()})});
}
let rd=null;
function vReadOne(i){
  const t=readTexts()[i];rd={t,i,start:0,phase:'idle',words:t.text.trim().split(/\s+/)};
  setView(`${topbar('Tập đọc')}<main class="wrap"><section class="card"><div id="rdclk" class="hint" style="font-weight:800"></div><div class="passage rtext" id="rtext" style="font-size:1.25rem;line-height:2">${rd.words.map((w,k)=>`<span class="rw" data-i="${k}">${esc(w)}</span>`).join(' ')}</div></section><div id="rdres"></div></main><div class="bar"><div class="in" id="bar"><button class="btn" data-act="rdListen">Nghe mẫu</button><button class="btn pri" id="rdbtn" data-act="rdStart">Bắt đầu đọc</button></div></div>`,()=>{
    $('#rtext').addEventListener('click',e=>{const w=e.target.closest('.rw');if(!w||rd.phase!=='tap')return;rdFinish(+w.dataset.i+1,60)});
  });

function rdStart(){
  stopSay();rd.phase='run';rd.start=Date.now();$$('.rw').forEach(x=>x.classList.remove('rdone'));$('#rdres').innerHTML='';
  const b=$('#rdbtn');b.textContent='Đọc xong rồi';b.dataset.act='rdStop';
  clearInterval(rd.tm);rd.tm=setInterval(()=>{const left=Math.max(0,60-Math.floor((Date.now()-rd.start)/1000));const c=$('#rdclk');if(!c||rd.phase!=='run'){clearInterval(rd.tm);return}c.textContent='Còn '+left+' giây';if(left<=0){clearInterval(rd.tm);rdTimeUp()}},250);
}
function rdTimeUp(){rd.phase='tap';beep(true);$('#rdclk').textContent='Hết 1 phút';$('#rdbtn').style.display='none';$('#rdres').innerHTML='<div class="card"><b>Hết 1 phút rồi. Con chạm vào chữ cuối cùng con đọc tới nhé.</b></div>'}
function rdStop(){
  if(rd.phase!=='run')return;const sec=(Date.now()-rd.start)/1000;if(sec<3){toast('Con đọc hết đoạn rồi hãy bấm nhé.');return}
  clearInterval(rd.tm);rdFinish(rd.words.length,Math.min(60,sec));
}
function rdFinish(n,sec){
  rd.phase='done';rd.n=n;rd.sec=sec;$$('.rw').forEach(x=>x.classList.toggle('rdone',+x.dataset.i<n));$('#rdclk').textContent='';
  const raw=Math.round(n/sec*60);
  $('#rdbtn').style.display='';$('#rdbtn').textContent='Đọc lại';$('#rdbtn').dataset.act='rdStart';
  $('#rdres').innerHTML=`<div class="card flds"><p>Con đọc được <b>${n} tiếng</b> trong <b>${Math.round(sec)} giây</b> (khoảng ${raw} tiếng một phút).</p>
   <label class="l">Bố mẹ nghe: bé đọc sai hoặc bỏ sót mấy tiếng?<input class="in" id="rdErr" inputmode="numeric" value="0" aria-label="Số tiếng đọc sai"></label>
   <button class="btn pri" data-act="rdCalc">Tính kết quả</button></div>`;
}
function rdCalc(){
  const err=Math.max(0,Math.min(rd.n,parseInt($('#rdErr').value,10)||0));
  const wpm=Math.max(0,Math.round((rd.n-err)/rd.sec*60));
  S.reads.push({wpm,raw:Math.round(rd.n/rd.sec*60),err,ts:Date.now()});if(S.reads.length>60)S.reads.shift();
  let earn=0;if(wpm>=60){earn=2;S.stars+=2}dayRec().q++;save();beep(wpm>=60);
  const msg=wpm>=60?(wpm<=70?'Đúng tốc độ cô yêu cầu!':'Con đọc nhanh hơn yêu cầu rồi. Nhớ đọc rõ chữ và đúng dấu nhé.'):'Con đọc chậm hơn một chút. Con đọc lại vài lần sẽ nhanh hơn.';
  $('#rdres').innerHTML=`<div class="card res"><div class="big">${wpm}</div><p>tiếng đọc đúng trong một phút${err?` (${rd.n} tiếng, trừ ${err} tiếng sai)`:''}</p><h3>${msg}</h3>${earn?`<p>+${earn} sao</p>`:''}${readChart()}</div>`;
}

  if(!pinOK){vPin();return}
  const days=Object.keys(S.days).sort().slice(-7);
  const weak=Object.entries(S.topics).map(([t,v])=>({t,n:v.ok+v.bad,bad:v.bad,p:v.bad/(v.ok+v.bad)})).filter(x=>x.n>=3).sort((a,b)=>b.p-a.p).slice(0,6);
